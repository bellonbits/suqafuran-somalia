<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- user-scalable=no was disabling pinch-to-zoom entirely -- an
         accessibility failure (low-vision users can't zoom) with no
         real upside, since nothing on this page needs to block zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Suqafuran - Somalia's Marketplace</title>
    <meta name="description" content="Buy and sell locally on Suqafuran -- browse thousands of products from local sellers and shops across Somalia, or list your own." />

    <!-- Preconnect to image CDNs (Cloudinary + Unsplash) so DNS + TLS shake hands early -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suqafuran" />
    <meta property="og:title" content="Suqafuran - Somalia's Marketplace" />
    <meta property="og:description" content="Buy and sell locally on Suqafuran -- browse thousands of products from local sellers and shops across Somalia, or list your own." />
    <meta property="og:image" content="https://suqafuran.so/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://suqafuran.so" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Suqafuran - Somalia's Marketplace" />
    <meta name="twitter:description" content="Buy and sell locally on Suqafuran -- browse thousands of products from local sellers and shops across Somalia, or list your own." />
    <meta name="twitter:image" content="https://suqafuran.so/og-image.png" />

    <!-- Theme detection script runs before React hydration to prevent flash -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const isDark = savedTheme === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          console.log('Theme initialization failed:', e);
        }
      })();
    </script>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
